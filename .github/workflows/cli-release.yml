name: Release CLI

# Manual "Run workflow" button (Actions → Release CLI). Bumps apps/cli/package.json on main,
# tags `cli-v<version>`, publishes `skif` to npm with provenance, and creates a GitHub release.
#
# The CLI is versioned independently of the platform (`v*` tags, release.yml).
#
# Safe to re-run: to retry a release that failed part-way, run again with `version` set to the
# version that failed. An existing tag is reused (the build comes from the tag), and steps that
# already happened (commit, tag, npm publish, GitHub release) are skipped.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when an explicit version is given)
        type: choice
        default: patch
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      version:
        description: Explicit version, e.g. 1.2.0 or 1.3.0-rc.1 (optional)
        type: string
        required: false
      dry_run:
        description: Dry run (build and test, but do not push, publish or release)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.0'

jobs:
  release:
    name: Release skif
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release CLI from the main branch (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Node 24 ships npm 11, which supports trusted publishing (OIDC) and provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the version
        id: version
        working-directory: apps/cli
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ -n "$EXPLICIT" ]; then
            version="${EXPLICIT#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$EXPLICIT' is not a semver version."
              exit 1
            fi
          else
            version="$(npx --yes semver@7.7.3 --increment "$BUMP" --preid rc "$current")"
          fi

          tag="cli-v$version"
          case "$version" in
            *-*) dist_tag=next; prerelease=true ;;
            *) dist_tag=latest; prerelease=false ;;
          esac

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          if npm view "skif@$version" version >/dev/null 2>&1; then
            on_npm=true
          else
            on_npm=false
          fi
          if [ "$tag_exists" = true ] && [ "$on_npm" = true ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::skif $version is already fully released."
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
            echo "tag_exists=$tag_exists"
            echo "on_npm=$on_npm"
          } >> "$GITHUB_OUTPUT"
          echo "### skif $current → $version" >> "$GITHUB_STEP_SUMMARY"
          echo "tag \`$tag\`, npm dist-tag \`$dist_tag\`, tag exists: $tag_exists, on npm: $on_npm, dry run: ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build from the existing tag
        if: steps.version.outputs.tag_exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout "refs/tags/$TAG"
          actual="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::$TAG has apps/cli version $actual, expected $VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and type-check
        working-directory: apps/cli
        run: |
          bun test
          bun run check

      - name: Set the package version
        if: steps.version.outputs.tag_exists == 'false'
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Not `npm version`: inside the Bun workspace it tries to reify the whole tree and fails on
        # the `workspace:*` protocol. Only the version field needs to change.
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("package.json", "utf8");
            const out = src.replace(/("version":\s*)"[^"]*"/, (_, k) => k + JSON.stringify(process.env.VERSION));
            if (out === src && JSON.parse(src).version !== process.env.VERSION) process.exit(1);
            fs.writeFileSync("package.json", out);
          '
          test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Build, pack and smoke-test under Node
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run build
          test "$(node dist/skif.js --version)" = "$VERSION"
          node dist/skif.js --help >/dev/null
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Commit and tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cli/package.json
          if ! git diff --cached --quiet; then
            git commit -m "release(cli): skif $VERSION"
          fi
          git tag -a "$TAG" -m "skif $VERSION"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: not pushing $TAG."
            git show --stat HEAD
          else
            # Atomic: either main moves and the tag lands, or neither does (e.g. main moved on).
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          fi

      - name: Publish to npm
        if: steps.version.outputs.on_npm == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional: only needed until trusted publishing is configured for `skif` on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$RUNNER_TEMP/pack/skif-$VERSION.tgz"
          if [ "$DRY_RUN" = true ]; then
            npm publish "$tarball" --access public --tag "$DIST_TAG" --dry-run
          else
            npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
          fi

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          previous="$(git tag --list 'cli-v*' --sort=-v:refname --merged "$TAG" | grep -vx "$TAG" | head -n1 || true)"
          range="${previous:+$previous..}$TAG"
          {
            echo "Install: \`npm install -g skif@$VERSION\`"
            echo
            echo "## Changes"
            git log --no-merges --pretty='- %s (%h)' "$range" -- apps/cli | grep -v 'release(cli):' || echo '- No CLI changes recorded.'
            echo
            echo "https://www.npmjs.com/package/skif/v/$VERSION"
          } > "$RUNNER_TEMP/notes.md"
          flags=(--title "skif $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest=false)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "$RUNNER_TEMP/pack/skif-$VERSION.tgz"
