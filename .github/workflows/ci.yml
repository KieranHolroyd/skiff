name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      managed_data: ${{ steps.filter.outputs.managed_data }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Decide whether the managed-data lane runs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
            git diff --name-only "$base" HEAD > /tmp/changed-files
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files 2>/dev/null || : > /tmp/changed-files
          fi
          echo "Changed files:"
          cat /tmp/changed-files
          if [ "${{ github.event_name }}" != "pull_request" ] ||
            grep -Eq '^(apps/helper/|apps/agent/|packages/core/src/database|packages/core/src/storage|packages/core/src/object-store|tests/e2e/|scripts/e2e/|\.github/workflows/ci\.yml)' /tmp/changed-files; then
            echo "managed_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "managed_data=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration history is compared with the base SHA, which may be many commits back.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check and lint
        run: bun run check

      - name: Migration safety
        env:
          # Compare against the target branch (PR) or previous push, not the branch tip.
          SKIFF_MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: bun scripts/check-migrations.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the CLI and smoke-test it under Node
        working-directory: apps/cli
        run: |
          bun run build
          node dist/skif.js --version
          node dist/skif.js --help >/dev/null
          npm pack --dry-run

  managed-data-e2e:
    name: Managed data e2e (Podman)
    needs: changes
    if: needs.changes.outputs.managed_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap
          # Rootless Podman on a GitHub runner needs a writable runtime dir; the runner user
          # has no systemd --user session, so create it explicitly.
          sudo mkdir -p "/run/user/$(id -u)"
          sudo chown "$(id -u):$(id -g)" "/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          podman --version
          podman info

      - name: Managed-data container lane
        run: SKIFF_E2E_ENGINE=podman bun tests/e2e/managed-data.e2e.ts

  e2e:
    name: End-to-end (REST + MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start control plane
        working-directory: apps/control-plane
        env:
          SKIFF_DEV_PASSWORD_LOGIN: '1'
          SKIFF_DATA_DIR: .data-ci
          SKIFF_PLATFORM_ORIGIN: http://localhost:5173
          SKIFF_CONTENT_DOMAIN: localhost
          BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789
        run: |
          bun run dev -- --port 5173 &
          echo $! > /tmp/skiff-cp.pid
          for i in $(seq 1 90); do
            curl -sf http://localhost:5173/api/setup/status >/dev/null && exit 0
            sleep 1
          done
          echo "control plane did not start" >&2
          exit 1

      - name: REST + agent e2e
        working-directory: apps/control-plane
        run: SKIFF_BASE=http://localhost:5173 bun tests/rest.e2e.ts

      - name: MCP OAuth e2e
        working-directory: apps/control-plane
        run: SKIFF_BASE=http://localhost:5173 bun tests/mcp-oauth.e2e.ts

      - name: Stop control plane
        if: always()
        run: kill "$(cat /tmp/skiff-cp.pid)" 2>/dev/null || true

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check installer and ops scripts
        run: shellcheck -s sh install.sh scripts/*.sh
