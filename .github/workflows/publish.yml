name: Publish release

# Every push to main whose VERSION has no release yet is tested, built once in CI per
# architecture, canaried under the production sandbox, signed and published as v<VERSION>.
# Hosts install these signed artifacts (skiff-update-self); nothing is compiled on a server.
#
# Releases are published as GitHub prereleases: the canary channel. Hosts on canary (the
# default) install them straight away; hosts on stable wait until promote.yml flips one to a
# full release. Promotion reuses these exact signed artifacts (docs/OPS.md §4.1).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'research_notes/**'
      - 'reports/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.4'
  CADDY_VERSION: '2.11.8'
  CADDY_DNS_CLOUDFLARE_VERSION: 'v0.2.4'
  XCADDY_VERSION: 'v0.4.7'
  GO_VERSION: '1.24'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Telemetry tests run against a real ClickHouse (D101); packages/core/src/test-clickhouse.ts.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports:
          - 18123:8123
        options: >-
          --health-cmd "clickhouse-client --password ci -q 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SKIFF_TEST_CLICKHOUSE_URL: http://127.0.0.1:18123
      SKIFF_TEST_CLICKHOUSE_USER: default
      SKIFF_TEST_CLICKHOUSE_PASSWORD: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test
            run: bun test
          - name: Type-check
            run: bun run check && bunx tsc -p scripts/tsconfig.json --noEmit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}

  # Runs alongside `test`: nothing here can reach a host until `publish`, which needs both.
  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      # The release ships Caddy with the DNS-01 module so the updater can upgrade the edge's
      # proxy together with the platform, instead of relying on a hand-built host binary. It
      # depends only on the pinned versions, so it is built natively once and then cached.
      - name: Restore Caddy
        id: caddy-cache
        uses: actions/cache@v4
        with:
          path: caddy/caddy
          key: caddy-${{ env.CADDY_VERSION }}-cloudflare-${{ env.CADDY_DNS_CLOUDFLARE_VERSION }}-xcaddy-${{ env.XCADDY_VERSION }}-go${{ env.GO_VERSION }}-linux-${{ matrix.arch }}

      - if: steps.caddy-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Caddy with caddy-dns/cloudflare
        if: steps.caddy-cache.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: '0'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"
          mkdir -p caddy
          "$RUNNER_TEMP/bin/xcaddy" build "v${CADDY_VERSION}" \
            --with "github.com/caddy-dns/cloudflare@${CADDY_DNS_CLOUDFLARE_VERSION}" \
            --output caddy/caddy

      - name: Check Caddy
        run: |
          chmod 0755 caddy/caddy
          caddy/caddy list-modules | grep -x 'dns.providers.cloudflare'
          tar -czf "skiff-caddy-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C caddy caddy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The same steps the host updater used to run, done once here instead of on every server.
      - name: Install and build
        working-directory: repo
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/control-plane build
          bun run --cwd apps/agent build
          bun run --cwd apps/cli build
          bun run --cwd apps/helper build

      # Dashboard node updates (D99) install only these two binaries on workers, so they ship as
      # their own small bundle instead of the full release tarball. Exactly two entries, no paths:
      # the helper on the node refuses anything else.
      - name: Package the node bundle
        working-directory: repo
        run: |
          stage="$(mktemp -d)"
          install -m 0755 apps/agent/dist/skiff-agent apps/helper/dist/skiff-helper "$stage/"
          tar -czf "../skiff-node-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C "$stage" skiff-agent skiff-helper
          tar -tzf "../skiff-node-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          ls -l ../skiff-node-*.tar.gz

      - name: Compile the stage-0 updater
        working-directory: repo
        run: |
          bun build --compile scripts/update-self/main.ts \
            --define "SKIFF_UPDATER_BUILD=\"${GITHUB_SHA::12}\"" \
            --outfile ../updater/skiff-updated
          ../updater/skiff-updated --version

      # Ship only what runs: build tooling (vite, svelte-check, eslint, drizzle-kit, ...) and the
      # SvelteKit build intermediates stay in CI. Done before the canary, so the canary boots
      # exactly the tree hosts install.
      - name: Prune to production dependencies
        working-directory: repo
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} +
          rm -rf apps/control-plane/.svelte-kit
          bun install --frozen-lockfile --production
          du -sh node_modules .

      - name: Canary under the production sandbox
        run: sudo env BUN_BIN="$(command -v bun)" repo/scripts/release/ci-canary.sh repo

      # Same gzip format hosts already unpack; pigz just compresses on every core.
      - name: Package
        run: |
          gz=gzip
          command -v pigz >/dev/null && gz=pigz
          echo "compressing with $gz"
          tar --use-compress-program="$gz" -cf "skiff-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            --exclude='repo/.git' \
            --exclude='repo/node_modules/.old_modules-*' \
            --exclude='repo/node_modules/.cache' \
            repo updater caddy
          ls -l skiff-*.tar.gz

      # The tarballs are already compressed; zipping them again only costs time.
      - uses: actions/upload-artifact@v4
        with:
          name: skiff-${{ matrix.arch }}
          path: skiff-*.tar.gz
          compression-level: 0
          retention-days: 7

  publish:
    name: Sign and publish v${{ needs.plan.outputs.version }}
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write and sign the manifest
        env:
          SKIFF_RELEASE_SIGNING_KEY: ${{ secrets.SKIFF_RELEASE_SIGNING_KEY }}
        run: |
          bun scripts/release/manifest.ts \
            --version "$VERSION" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --dir dist
          cp scripts/release/recover.sh dist/skiff-recover.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Skiff $VERSION" \
            --notes "Signed canary built from ${GITHUB_SHA::12}. Canary hosts install it with \`skiff-update-self\` (dashboard: Settings → Updates); stable hosts get it once it is promoted with the Promote workflow."
