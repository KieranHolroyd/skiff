name: Docs

# Builds the standalone docs site (apps/docs) from packages/docs/content and, when a Yoal
# instance is configured, deploys it there. Runs whenever the docs or the platform version change,
# so the published docs always describe the latest platform release. The dashboard's own /docs and
# the agents' search_docs index need no job: they are bundled into every control-plane build.
#
# To deploy, set in the repository settings:
#   secrets.YOAL_DOCS_TOKEN   an API key (yoal_…) with project:create and deployment:create
#   vars.YOAL_DOCS_URL        the control plane, e.g. https://control.example.com
#   vars.YOAL_DOCS_PROJECT    optional project slug (default: yoal-docs)
#   vars.YOAL_DOCS_SITE_URL   optional public URL, for canonical links and the sitemap
# Without them the job still builds and uploads the site as an artifact.

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'apps/docs/**'
      - 'VERSION'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'packages/docs/**'
      - 'apps/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check content (links, frontmatter, diagrams) and search index
        run: bun test packages/docs
      - name: Build site
        run: bun run --cwd apps/docs build
        env:
          DOCS_SITE_URL: ${{ vars.YOAL_DOCS_SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/dist
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      YOAL_URL: ${{ vars.YOAL_DOCS_URL }}
      YOAL_TOKEN: ${{ secrets.YOAL_DOCS_TOKEN }}
    steps:
      - name: Skip when no Yoal instance is configured
        if: env.YOAL_URL == '' || env.YOAL_TOKEN == ''
        run: echo "::notice::Set vars.YOAL_DOCS_URL and secrets.YOAL_DOCS_TOKEN to deploy the docs."
      - uses: actions/checkout@v4
        if: env.YOAL_URL != '' && env.YOAL_TOKEN != ''
        with:
          sparse-checkout: VERSION
      - uses: actions/download-artifact@v4
        if: env.YOAL_URL != '' && env.YOAL_TOKEN != ''
        with:
          name: docs-site
          path: dist
      - uses: oven-sh/setup-bun@v2
        if: env.YOAL_URL != '' && env.YOAL_TOKEN != ''
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Deploy to Yoal
        if: env.YOAL_URL != '' && env.YOAL_TOKEN != ''
        run: |
          bunx @yoal/cli deploy dist \
            --project "${{ vars.YOAL_DOCS_PROJECT || 'yoal-docs' }}" \
            --message "docs for v$(cat VERSION) (${GITHUB_SHA::7})" \
            --json
