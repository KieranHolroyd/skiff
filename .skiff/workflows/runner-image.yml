name: Runner image

# skiff-runner, the default job image (docker/runner/Dockerfile, docs/PIPELINES.md §4.2): built
# natively on each architecture with skiff/build-image (the per-job BuildKit sidecar), joined into
# one multi-arch tag with skiff/image-index, and mirrored to GHCR.
#
# Pull requests build without pushing. Pushes to main publish `registry/skiff-runner:<sha>` (the
# org's own namespace: `registry/<name>` expands to <registry host>/<org slug>/<name>) and
# `:latest` on Skiff's registry, and the same index on ghcr.io (GHCR_TOKEN lives in the `release`
# environment: allowed refs refs/heads/main, approval required — configured on the repository).

on:
  push:
    branches: [main]
    paths:
      - 'docker/runner/**'
      - '.skiff/workflows/runner-image.yml'
  pull_request:
    paths:
      - 'docker/runner/**'
      - '.skiff/workflows/runner-image.yml'
  workflow_dispatch:

concurrency:
  group: 'runner-image-${{ skiff.ref }}'
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'
  NODE_MAJOR: '22'
  GHCR_IMAGE: ghcr.io/kieranholroyd/skiff-runner

jobs:
  image:
    name: 'skiff-runner (${{ matrix.arch }})'
    runs-on: [linux, '${{ matrix.arch }}', oci-build]
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: skiff/checkout@v1

      - id: build
        uses: skiff/build-image@v1
        with:
          context: docker/runner
          file: docker/runner/Dockerfile
          tags: 'registry/skiff-runner:${{ skiff.sha }}-${{ matrix.arch }}'
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ skiff.repository }}
            org.opencontainers.image.revision=${{ skiff.sha }}
          push: "${{ skiff.event_name != 'pull_request' }}"

      - name: Not pushed on pull requests
        if: skiff.event_name == 'pull_request'
        run: echo "Built ${{ steps.build.outputs.tags }} (not pushed on pull requests)."

  publish:
    name: Multi-arch index
    needs: image
    if: skiff.event_name != 'pull_request'
    runs-on: linux
    outputs:
      image: '${{ steps.index.outputs.image }}'
    steps:
      - id: index
        uses: skiff/image-index@v1
        with:
          tag: 'registry/skiff-runner:${{ skiff.sha }}'
          # By tag: matrix jobs share one outputs map (last writer wins), so per-arch digests
          # cannot travel through job outputs.
          sources: |
            registry/skiff-runner:${{ skiff.sha }}-x64
            registry/skiff-runner:${{ skiff.sha }}-arm64

      - if: skiff.ref == 'refs/heads/main'
        uses: skiff/image-index@v1
        with:
          tag: registry/skiff-runner:latest
          sources: '${{ steps.index.outputs.image }}'

  mirror:
    name: Mirror to GHCR
    needs: publish
    if: skiff.ref == 'refs/heads/main'
    environment: release
    runs-on: linux
    steps:
      # Copies the per-arch manifests and their blobs to GHCR, then writes the same index there.
      - uses: skiff/image-index@v1
        with:
          tag: '${{ env.GHCR_IMAGE }}:${{ skiff.sha }}'
          sources: '${{ needs.publish.outputs.image }}'
          username: kieranholroyd
          password: '${{ secrets.GHCR_TOKEN }}'
      - uses: skiff/image-index@v1
        with:
          tag: '${{ env.GHCR_IMAGE }}:latest'
          sources: '${{ needs.publish.outputs.image }}'
          username: kieranholroyd
          password: '${{ secrets.GHCR_TOKEN }}'
