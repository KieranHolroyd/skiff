# Skiff SQLite -> Cloudflare R2 continuous replication.
#
# Installed at /etc/skiff/litestream.yml and read by skiff-litestream.service.
# Litestream expands ${VAR} from the service environment (EnvironmentFile=/etc/skiff/skiff.env).
# Do not put literal credentials in this file; keep them in /etc/skiff/skiff.env (0640 root:skiff).
#
# Required env: the same names the control plane uses, all written by the installer when
# --object-store r2 is selected:
#   SKIFF_DATA_DIR         /var/lib/skiff/data
#   R2_BUCKET
#   R2_ENDPOINT            https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
# Replicas live under the fixed prefix skiff/sqlite/ in the bucket, apart from release artifacts
# and the telemetry Parquet archive.
#
# Restore:  skiff-restore              (scripts/restore.sh --yes)
# Drill:    skiff-restore-drill        (systemctl start skiff-restore-drill.service)

dbs:
  - path: ${SKIFF_DATA_DIR}/skiff.db
    replicas:
      - type: s3
        bucket: ${R2_BUCKET}
        path: skiff/sqlite
        endpoint: ${R2_ENDPOINT}
        region: auto
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        # Keep RPO small: WAL frames are shipped about once a second.
        sync-interval: 1s
        # A full snapshot a day keeps restores fast; retention bounds R2 storage.
        snapshot-interval: 24h
        retention: 720h
