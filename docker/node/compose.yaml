# A Yoal node (agent + Caddy) as an Arcane-managed Compose project.
#
# This is the static-serving path only: the agent reconciles releases into its
# cache and Caddy serves them. Tier-2/3 workloads need the host install because
# they are systemd units rendered by the privileged helper.
#
# Create the node in the control plane first (Nodes -> Add node), copy
# .env.example to .env, fill it in, then join and start:
#
#   docker compose run --rm --entrypoint /opt/yoal/yoal-agent \
#     node join "$YOAL_CONTROL_URL" --token "$JOIN_TOKEN" --name "$(hostname)"
#   docker compose up -d

name: yoal-node

services:
  node:
    image: ghcr.io/kieranholroyd/yoal-node:${YOAL_IMAGE_TAG:-latest}
    container_name: yoal-node
    restart: unless-stopped

    ports:
      # The edge reaches Caddy on the WireGuard address. Never expose this on
      # 0.0.0.0: it is the node's public content listener for the tunnel.
      - '${YOAL_BIND_ADDRESS:?Set YOAL_BIND_ADDRESS to the WireGuard address}:${YOAL_HTTP_PORT:-8080}:8080'

    environment:
      YOAL_CONTROL_URL: ${YOAL_CONTROL_URL:?Set YOAL_CONTROL_URL}
      # Leave both empty to use the node.json written by `join`, or set them to
      # skip the join step for an environment created directly in the dashboard.
      YOAL_NODE_ID: ${YOAL_NODE_ID:-}
      YOAL_NODE_TOKEN: ${YOAL_NODE_TOKEN:-}
      # Plain HTTP inside the container: the edge terminates TLS and WireGuard
      # encrypts the hop.
      YOAL_CADDY_LISTEN: ':8080'
      YOAL_TLS: '0'
      YOAL_CERT_PROBE_ADDR: 'off'
      # No helper in this container, so there are no workload journals to drain.
      YOAL_LOG_DRAIN: '0'

    volumes:
      # Releases, Caddy state and the joined node identity.
      - yoal-data:/var/lib/yoal

    # Sockets only. A fresh tmpfs avoids a stale caddy-admin.sock blocking a
    # restart; uid/gid match the image's yoal user.
    tmpfs:
      - /run/yoal:mode=0770,uid=10001,gid=10001

    healthcheck:
      test: ['CMD-SHELL', 'test -S /run/yoal/caddy-admin.sock && test -S /run/yoal/agent.sock']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  yoal-data:
